# Generated by vyatta system on FIXTURE DATE
set default=2
set timeout=5
set console_param="tty0"


set superusers="admin "

password_pbkdf2 admin grub.pbkdf2.sha512.10000.FIXTURE



load_env
if [ "$serial_unit" != "" ]; then

    serial --unit=$serial_unit --speed=$serial_speed
    terminal_input --append serial
    terminal_output --append serial

fi


#-------------------1.0+a----------
menuentry "Vyatta 1.0+a (Configured console)" --unrestricted {
    set console_param="tty0"
    load_env
    if [ "$boot_console" != "" ]; then
        if [ "$boot_console" != "tty0" ]; then
            set console_param="$boot_console,$serial_speed"
        fi
    fi
    set crashkernel_arg=""
    if [ -s /boot/1.0+a/vyatta.grubenv ]; then
        crashkernel_mem=""
        load_env --file /boot/1.0+a/vyatta.grubenv crashkernel_mem
        if [ "$crashkernel_mem" != "" ]; then
            set crashkernel_arg="crashkernel=$crashkernel_mem"
        fi
    fi
    linux /boot/1.0+a/vmlinuz boot=live quiet systemd.show_status=1 systemd.unified_cgroup_hierarchy=1 nofastboot net.ifnames=1 iommu=pt vyatta-union=/boot/1.0+a console=$console_param $crashkernel_arg  
    initrd /boot/1.0+a/initrd.img
}

